<!-- 상담 신청 (서브페이지 공통) -->
<section class="apply-wide" id="apply">
  <div class="container wrap">
    <div>
      <h2>지금, <span class="y">내 농지</span>부터 점검하세요</h2>
      <p class="lead">연락처를 남겨주시면 전화로 농지 상황을 여쭤보고, <strong>지금 어느 단계인지</strong>부터 정리해 드립니다. 무료진단 후에는 필요한 서비스 하나만 추천하며, 강요하지 않습니다.</p>
      <ul class="contact-list">
        <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2z"/></svg></span><div><small>전화 상담 · <span data-hours>[상담 가능 시간]</span></small><a href="tel:00000000000" data-phone-link><b data-phone>[상담전화]</b></a></div></li>
        <li data-hide-wrap><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8c-1 0-2-.2-2.9-.5L5 21l1.6-3.6A8 8 0 1 1 21 12z"/></svg></span><div><small>카카오톡 채널</small><a data-link="kakao" data-hide-empty href="#"><b>올바른농지 채널 열기</b></a></div></li>
        <li data-hide-wrap><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span><div><small>이메일</small><a data-link="email" data-hide-empty href="#"><b data-email>이메일 문의</b></a></div></li>
      </ul>
    </div>
    <form class="quick apply-form" id="applyForm" novalidate>
      <h3>무료 농지진단 신청</h3>
      <p class="s">이름과 연락처만 남겨주세요. 농지 상황은 전화로 여쭤봅니다.</p>
      <div class="f-row">
        <div class="f"><label for="name">이름 <span class="req">*</span></label><input type="text" id="name" name="name" placeholder="홍길동" autocomplete="name" required></div>
        <div class="f"><label for="phone">연락처 <span class="req">*</span></label><input type="tel" id="phone" name="phone" placeholder="010-1234-5678" autocomplete="tel" inputmode="tel" required></div>
      </div>
      <input type="text" name="company" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="consent"><input type="checkbox" name="consent" id="consent" required> 상담 목적의 개인정보 수집·이용에 동의합니다. <a href="privacy.html" target="_blank" rel="noopener">처리방침 보기</a></label>
      <button type="submit" class="btn btn-green btn-block" id="submitBtn">무료진단 신청하기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <p class="fine">※ 상담 내용은 철저히 비밀이 보장됩니다.</p>
      <div class="form-msg" role="status"></div>
    </form>
  </div>
</section>
