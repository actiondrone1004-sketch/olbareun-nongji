<!-- 상담 신청 (모든 페이지 공통). 자세한 상담은 카카오톡 채널, 폼은 전화 요청용 -->
<section class="apply-wide" id="apply">
  <div class="container wrap">
    <div>
      <h2>이야기는<br>채널에서 이어가요.</h2>
      <p class="lead">농지 위치와 지금 상황을 편하게 남겨 주세요. 대표가 직접 확인하고 연락드립니다. 첫 상담은 무료이며, 비용은 범위를 확인하고 동의하신 뒤에만 발생합니다.</p>
      <ul class="contact-list">
        <li data-hide-wrap><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8c-1 0-2-.2-2.9-.5L5 21l1.6-3.6A8 8 0 1 1 21 12z"/></svg></span><div><small>카카오톡 채널</small><a data-link="kakao" data-hide-empty href="#"><b>올바른농지 채널에서 상담하기</b></a></div></li>
        <li><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2z"/></svg></span><div><small>전화 상담 · <span data-hours>평일 09:00 ~ 18:00</span></small><a href="tel:00000000000" data-phone-link><b data-phone>[상담전화]</b></a></div></li>
      </ul>
    </div>
    <form class="quick apply-form" id="applyForm" novalidate>
      <h3>전화로 연락받기</h3>
      <p class="s">이름과 연락처만 남기시면 먼저 전화드립니다.</p>
      <div class="f">
        <label for="situation">지금 상황 <small>(선택)</small></label>
        <select id="situation" name="situation" data-label="상담 상황">
          <option value="">잘 모르겠어요</option>
          <option value="상속·취득한 농지">상속·취득한 농지</option>
          <option value="원거리 관리">멀리 있어 관리가 어려운 농지</option>
          <option value="영농 시작">직접 농사를 시작하고 싶어요</option>
          <option value="조사·통지 받음">조사 연락이나 통지를 받았어요</option>
        </select>
      </div>
      <div class="f-row">
        <div class="f"><label for="name">이름 <span class="req">*</span></label><input type="text" id="name" name="name" placeholder="홍길동" autocomplete="name" required></div>
        <div class="f"><label for="phone">연락처 <span class="req">*</span></label><input type="tel" id="phone" name="phone" placeholder="010-1234-5678" autocomplete="tel" inputmode="tel" required></div>
      </div>
      <input type="text" name="company" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label class="consent"><input type="checkbox" name="consent" id="consent" required> 상담 목적의 개인정보 수집·이용에 동의합니다. <a href="privacy.html" target="_blank" rel="noopener">처리방침 보기</a></label>
      <button type="submit" class="btn btn-green btn-block" id="submitBtn">연락 요청하기</button>
      <p class="fine">※ 신청만으로 계약이 되지 않습니다.</p>
      <div class="form-msg" role="status"></div>
    </form>
  </div>
</section>
